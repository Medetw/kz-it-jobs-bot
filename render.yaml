services:
  - type: worker
    name: kz-it-jobs-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    envVars:
      # Use JSON fallback — no disk needed, no credit card required
      - key: DB_PATH
        value: /app/data/jobs.db
      - key: JSON_FALLBACK_PATH
        value: /tmp/jobs_fallback.json
      - key: BOT_TOKEN
        sync: false
      - key: TARGET_CHANNEL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "30"
      - key: POST_DELAY_SECONDS
        value: "3.0"

