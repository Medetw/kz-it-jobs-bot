services:
  - type: worker               # Background Worker — stays running 24/7, no HTTP needed
    name: kz-it-jobs-bot
    runtime: docker            # Use our Dockerfile
    dockerfilePath: ./Dockerfile
    region: frankfurt          # Closest to Kazakhstan; alternatives: singapore, oregon
    plan: free                 # Free tier is fine for a bot
    disk:
      name: bot-data
      mountPath: /app/data     # Persistent volume for SQLite DB
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /app/data/jobs.db
      - key: JSON_FALLBACK_PATH
        value: /app/data/jobs_fallback.json
      # ── Set these in the Render dashboard, NOT here (keep secrets out of git) ──
      - key: BOT_TOKEN
        sync: false            # Render will prompt you to fill this in dashboard
      - key: TARGET_CHANNEL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "30"
      - key: POST_DELAY_SECONDS
        value: "3.0"
